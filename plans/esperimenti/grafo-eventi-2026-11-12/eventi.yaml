# --- Il giorno della scena: dal file (finestra dell'arco in state.yaml)
# Prima regola che combacia col nome del file vince. ARC-07 [INFERRED]: tutto prima del Day 19.
finestre_file:
  - {rx: "^07_", giorni: [14, 19], fonte: "ARC07-00-INDICE, cronologia approvata dal DM il 2026-07-03: Day 14-15 → 18-19"}
  - {rx: "^08_", giorni: [1, 21], fonte: "ARC08-12-CRONOLOGIA-MARCH-CLOCK: Day 1 (avanguardia) → Day 21 (Cerimonia)"}
  - {rx: "P1A", giorni: [20, 30]}
  - {rx: "P1B", giorni: [22, 28]}
  - {rx: "P1C", giorni: [25, 30]}
  - {rx: "P2A|Torre", giorni: [28, 35]}
  - {rx: "P2B|Torneo", giorni: [25, 34]}
  - {rx: "P2C|Salvatore", giorni: [28, 36]}
  - {rx: "P2-RHEST|Rhest", giorni: [25, 32]}
  - {rx: "Starsong", giorni: [30, 35]}
  - {rx: "Ghostlord", giorni: [25, 32]}
  - {rx: "Sabotaggio", giorni: [30, 36]}
  - {rx: "Missioni", giorni: [30, 38]}
  - {rx: "BATTAGLIA-FINALE", giorni: [42, 42]}
  - {rx: "^09_", giorni: [20, 41], fonte: "march_clock.finestra: Arc 09, Days 20-41"}
