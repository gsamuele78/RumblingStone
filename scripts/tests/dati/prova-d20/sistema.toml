# Plugin finto per la prova del nove (ADR-0111, L8): un sistema d20 che si
# aggiunge al repo senza toccare una riga di codice. Lo usa solo
# scripts/tests/test_sistemi_prova_del_nove.py, che lo copia in un repo
# temporaneo; non è mai in sistemi/ e nessuno strumento lo vede.
#
# Eredita quasi tutto dal 3.5 e cambia due regole, perché la prova serva:
# soglie dei PE diverse e un altro raddoppio nell'EL.

id = "prova-d20"
nome = "Sistema d20 di prova (solo test)"
tipo = "sistema"
famiglia = "d20"
licenza = "nessuna (dati inventati per il test)"
fonti = []
riconosci = ["Prova d20"]
skill = []

