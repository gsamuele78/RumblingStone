# sistemi/d20/dati/termini-vietati.toml — le meccaniche 5e vietate nella famiglia d20 (ADR-0111, L3)
#
# Una lista sola, letta da validate_modules.py (master ARC*-DEF-*, riga per
# riga, con l'esenzione della riga che vieta il termine) e da
# validate_standalone.py (moduli autoconclusivi, senza distinguere maiuscole).
# Prima erano due liste diverse nei due script: l'unione, provata sul repo
# il 2026-11-07, non trova nessun rilievo nuovo.
#
# ⚠ Solo le forme che sono DAVVERO la meccanica 5e: in italiano «una Lunghezza
# di vantaggio» è lingua normale, e un validatore che grida al lupo viene
# disattivato entro una settimana.

[[vietato]]
regex = '\b(?:bonus actions?|azion[ei] bonus)\b'
perche = "terminologia 5e (bonus action → azione veloce/swift)"

[[vietato]]
regex = '\blair actions?\b|\bazion[ei] del covo\b'
perche = "terminologia 5e (lair action, azione del covo → attacco speciale con ricarica)"

[[vietato]]
regex = '(?<![A-Za-z])DC\s?[0-9]'
perche = "usare CD, non DC (Classe Difficoltà, convenzione repo)"

[[vietato]]
# Il riposo breve e il riposo lungo sono della 5e. In 3.5 e in PF1e ci sono le
# otto ore di sonno (incantesimi, capacità al giorno, 1 pf per livello) e il
# tempo che passa. Il DM, 2026-09-27: «non esistono riposi lunghi e corti».
# «lungo il muro» è una preposizione, non un riposo.
regex = '''(?i)\bripos[oi]\b[^.\n]{0,25}?\**\b(?:brev[ei]|cort[oi]|lung[oh]i?)\b(?!\s+(?:il|lo|la|i|gli|le|l'|un|una|tutt)\b)|\b(?:brev[ei]|cort[oi]|lung[oh]i?)\s+ripos[oi]\b|\b(?:short|long)[\s-]+rests?\b'''
perche = "riposo breve/lungo (5e) → otto ore di sonno, guarigione naturale SRD"

[[vietato]]
regex = '\bcon (?:un )?vantaggio\b'
perche = "tirare «con vantaggio» (5e) → nessun equivalente"

[[vietato]]
regex = '\bcon (?:uno )?svantaggio\b'
perche = "tirare «con svantaggio» (5e) → nessun equivalente"
