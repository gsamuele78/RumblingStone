# sistemi/dnd35/sistema.toml — Dungeons & Dragons 3.5 (ADR-0111)
#
# Il sistema base della campagna. Le capacità «codice» sono le tabelle che
# il censimento del 2026-11-07 ha trovato cablate negli script: il lotto
# dice quando diventano dati di questa cartella.

id = "dnd35"
nome = "Dungeons & Dragons 3.5 (SRD)"
tipo = "sistema"
famiglia = "d20"
licenza = "OGL 1.0a"
fonti = ["SRD 3.5 in cache (riscontro_srd.py, chiave srd35)"]
skill = ["dnd-35-srd", "dnd-35-rules", "npc-villain-boosting"]

[capacita]
"termini.vietati" = { eredita = "d20", motivo = "le meccaniche 5e sono vietate in tutta la famiglia" }
"statblocco.campi" = { eredita = "d20", motivo = "GS, CA, pf e TS sono gli stessi campi in 3.5 e PF1e" }
"lessico.abilita" = { codice = ["scripts/validate_prosa.py:ABILITA", "scripts/domande_developer.py:ABILITA_ESTRANEE"], lotto = "L3" }
"lessico.entita" = { codice = ["scripts/coerenza_campagna.py:CLASSI", "scripts/coerenza_campagna.py:RAZZE"], lotto = "L3" }
"lessico.italiano" = { dati = ["scripts/lessico_it_35.tsv"] }
"fonti.regole" = { codice = ["scripts/riscontro_srd.py:FONTI"], lotto = "L3" }
"pe.soglie" = { codice = ["scripts/update_xp.py:THRESHOLDS"], lotto = "L4" }
"tesoro.per_livello" = { dati = ["scripts/loot_tables.yaml", "scripts/magic_items_srd.yaml"] }
"incontri.livello" = { codice = ["scripts/suggest_encounter.py:combine_el"], lotto = "L4" }
"creature.costruzione" = { codice = ["scripts/dmcore/tabelle.py:TIPI", "scripts/dmcore/tabelle.py:CLASSI", "scripts/dmcore/tabelle.py:BAB_CLASSE", "scripts/dmcore/tabelle.py:TAGLIE", "scripts/dmcore/tabelle.py:ARMATURE", "scripts/dmcore/tabelle.py:ELITE", "scripts/dmcore/tabelle.py:BASIC", "scripts/dmcore/progressione.py:PRESTIGIO", "scripts/dmcore/caratteristiche.py:PROFILI"], lotto = "L5" }
"creature.statistiche_per_gs" = { eredita = "pf1e", motivo = "l'SRD 3.5 non ha bersagli per GS: si usa la Tab. 1-1 PF1e come guardia, non come fonte (dmcore/tabelle.py)" }
"creature.incantesimi" = { codice = ["scripts/dmcore/incantesimi.py:LISTE"], lotto = "L5" }
"creature.regole_di_tipo" = { codice = ["scripts/dmcore/tabelle.py:TIPI"], lotto = "L5" }
