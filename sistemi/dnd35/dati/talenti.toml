# sistemi/dnd35/dati/talenti.toml — talenti SRD 3.5 e talenti bonus delle classi.
# Generato da plans/esperimenti/regole-complete-2026-11-10/estrai_talenti.py (non a mano).
# Fonte: olimot/srd-v3.5-md@c7f30a0c, feats.md e character-classes-i/ii.md. OGL 1.0a.

# [capacita]: classi che hanno la capacità chiesta da un talento, e da quale livello
# (colonna «Special» delle tabelle; per «cast … spells» la prima riga della griglia).
[capacita]
"cast arcane spells" = { "bardo" = 1, "mago" = 1, "stregone" = 1 }
"cast divine spells" = { "chierico" = 1, "druido" = 1, "paladino" = 5, "ranger" = 5 }
"cast spells" = { "bardo" = 1, "chierico" = 1, "druido" = 1, "mago" = 1, "paladino" = 5, "ranger" = 5, "stregone" = 1 }
"lay on hands" = { "paladino" = 2 }
"rage" = { "barbaro" = 1 }
"turn or rebuke creatures" = { "chierico" = 1, "paladino" = 4 }
"wild shape" = { "druido" = 5 }

# [talenti."Nome inglese"]: it, tipi, prerequisiti (car, bab, lic, talenti, classe, gradi).
# `altro` = prerequisiti che il testo dice e la regola non sa leggere: il generatore salta il talento.
# [bonus."classe"]: livelli dei talenti bonus, lista (tipi e nomi; nomi per livello d'ingresso),
# senza_prerequisiti se la classe li ignora, concessi = talenti dati per nome dalla tabella o dal
# testo delle capacità; tipi_livello e scelte = la lista di quel solo livello (tattico del cavaliere,
# compagno preciso del cacciatore); stili = liste per stile di combattimento o stirpe.

