# Scritto da plans/esperimenti/regole-senza-omissioni-2026-11-12/estrai_prestigio.py:
# non si modifica a mano. Requisiti delle classi di prestigio, solo nomi e numeri.
# 15 classi dall'SRD 3.5, 478 dai manuali (tag PRE di PCGen); l'SRD vince.
# 6 classi dei manuali stanno in più libri con requisiti diversi (`diverge`):
# tengono i primi e il verificatore non ne fa una violazione.
# `non_verificati` conta i requisiti che non si riducono a un numero (speciali, divinità, lingue).

# descrizioni delle classi: chi lancia incantesimi arcani e chi divini
[tipi_di_magia]
arcane = ["bard", "sorcerer", "wizard"]
divine = ["cleric", "druid", "paladin", "ranger"]

