# SRD, «Special Materials»: costo in più dell'oggetto (mo), per categoria
leggera = 1000
media = 4000
pesante = 9000
scudo = 1000

# come una scheda scrive un oggetto (espressioni regolari; non vengono dall'SRD). «N» è il bonus letto.
[[oggetti.nomi]]
nome = "ring of protection +N"
schema = '''(?:anello|ring)\s+(?:di|della|of)\s+(?:protezione|deviazione|protection)\s*\+(\d)'''

[[oggetti.nomi]]
nome = "cloak of resistance +N"
schema = '''(?:mantello|cloak)\s+(?:della|di|of)\s+(?:resistenza|resistance)\s*\+(\d)'''

[[oggetti.nomi]]
nome = "cloak of charisma +N"
schema = '''(?:mantello|cloak)\s+(?:del|di|of)\s+(?:carisma|charisma)\s*\+(\d)'''

[[oggetti.nomi]]
nome = "amulet of health +N"
schema = '''(?:amuleto|amulet)\s+(?:della|di|of)\s+(?:salute|health)\s*\+(\d)'''

[[oggetti.nomi]]
nome = "amulet of natural armor +N"
schema = '''(?:amuleto|amulet)\s+(?:(?:dell['’]|di|of)\s*)?(?:armatura naturale|natural armor)\s*\+(\d)'''

[[oggetti.nomi]]
nome = "gauntlets of ogre power"
schema = '''guanti\s+della\s+forza\s+dell['’]\s*ogre|gauntlets\s+of\s+ogre\s+power'''

[[oggetti.nomi]]
nome = "gloves of dexterity +N"
schema = '''(?:guanti|gloves)\s+(?:della|di|of)\s+(?:destrezza|dexterity)\s*\+(\d)'''

[[oggetti.nomi]]
nome = "belt of giant strength +N"
schema = '''(?:cintura\s+della\s+forza\s+(?:del|dei)\s+gigant[ei]|belt\s+of\s+giant\s+strength)\s*\+(\d)'''

[[oggetti.nomi]]
nome = "headband of intellect +N"
schema = '''(?:fascia\s+dell['’]\s*intelletto|headband\s+of\s+intellect)\s*\+(\d)'''

[[oggetti.nomi]]
nome = "periapt of wisdom +N"
schema = '''(?:(?:periapto|pendente)\s+(?:della|di)\s+saggezza|periapt\s+of\s+wisdom)\s*\+(\d)'''

[[oggetti.nomi]]
nome = "bracers of armor +N"
schema = '''(?:bracciali\s+(?:dell['’]|di)\s*armatura|bracers\s+of\s+armor)\s*\+(\d)'''

[[oggetti.nomi]]
nome = "boots of speed"
schema = '''stivali\s+(?:di|della)\s+velocit[àa]|boots\s+of\s+speed'''

[[oggetti.nomi]]
nome = "ring of mind shielding"
schema = '''(?:anello|ring)\s+(?:di|dello|of)\s+(?:mind shielding|schermo mentale)'''
