"sleight of hand" = ["bluff"]
"spellcraft" = ["knowledge", "use magic device"]
"survival" = ["knowledge", "search"]
"tumble" = ["jump"]
"use magic device" = ["decipher script", "spellcraft"]
"use rope" = ["escape artist"]

