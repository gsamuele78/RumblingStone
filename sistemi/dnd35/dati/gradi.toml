# chi con 5 gradi dà +2 a un'abilità (SRD, «Synergy» di ogni abilità): abilità → fonti
[sinergie]
"appraise" = ["craft"]
"balance" = ["tumble"]
"climb" = ["use rope"]
"diplomacy" = ["bluff", "knowledge", "sense motive"]
"disguise" = ["bluff"]
"escape artist" = ["use rope"]
