# sistemi/dnd35/dati/incantesimi.toml — liste di incantesimi 3.5 per classe × funzione (ADR-0111, L5c)
#
# Spostate senza cambiare una voce da scripts/dmcore/incantesimi.py (2026-11-07).
# Ogni voce viene dall'ancora in dnd-35-srd/references/spells.md per quella classe
# e quel livello. Poche voci per livello, ed è voluto: sono gli incantesimi che
# quella funzione lancerebbe davvero, non tutto il SRD.

# nome di classe come lo scrive il DM → chiave delle liste
[canonica]
"wizard" = "mago"
"mago" = "mago"
"sorcerer" = "stregone"
"stregone" = "stregone"
"cleric" = "chierico"
"chierico" = "chierico"
"druid" = "druido"
"druido" = "druido"
"bard" = "bardo"
"bardo" = "bardo"
"ranger" = "ranger"
"paladin" = "paladino"
"paladino" = "paladino"
"adept" = "adepto"
"adepto" = "adepto"

# cella (classe × funzione) assente → altra funzione della STESSA classe, mai di un'altra
[ripiego]
"mago" = "utilita"
"stregone" = "utilita"
"chierico" = "supporto"
"druido" = "controllore"
"bardo" = "supporto"
"ranger" = "utilita"
"paladino" = "supporto"

# Mago e stregone hanno la stessa lista nel SRD: una copia sola, l'altra è un alias.
# Classi per cui una lista non è scritta: il generatore non sceglie invece di scegliere male.
[regole]
alias = { stregone = "mago" }
senza_lista = ["adept", "adepto"]


# ── arcano: mago (e stregone, alias) — SRD «Sorcerer/Wizard Spells» ──
[liste.mago.controllore]
"0" = ["prestidigitazione", "luce", "lettura del magico", "mano magica"]
