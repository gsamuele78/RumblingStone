# sistemi/dnd35/dati/creature.toml — le tabelle base per costruire una creatura 3.5 (ADR-0111, L5a)
#
# Spostate senza cambiare un valore da scripts/dmcore/tabelle.py (2026-11-07).
# Le fonti per tabella sono quelle di tabelle.PROVENIENZA; le chiavi italiane
# sono alias delle inglesi, come prima.

# tipo = { dv = faccia del dado, bab = per DV, ts_buoni }
[tipi]
"aberration" = { dv = 8, bab = 0.75, ts_buoni = ["vol"] }
"animal" = { dv = 8, bab = 0.75, ts_buoni = ["temp", "rifl"] }
"construct" = { dv = 10, bab = 0.75, ts_buoni = [] }
"dragon" = { dv = 12, bab = 1.0, ts_buoni = ["temp", "rifl", "vol"] }
"elemental" = { dv = 8, bab = 0.75, ts_buoni = ["rifl"] }
"fey" = { dv = 6, bab = 0.5, ts_buoni = ["rifl", "vol"] }
"giant" = { dv = 8, bab = 0.75, ts_buoni = ["temp"] }
"humanoid" = { dv = 8, bab = 0.75, ts_buoni = ["temp"] }
"magical beast" = { dv = 10, bab = 1.0, ts_buoni = ["temp", "rifl"] }
"monstrous humanoid" = { dv = 8, bab = 1.0, ts_buoni = ["rifl", "vol"] }
"ooze" = { dv = 10, bab = 0.75, ts_buoni = [] }
"outsider" = { dv = 8, bab = 1.0, ts_buoni = ["temp", "rifl", "vol"] }
"plant" = { dv = 8, bab = 0.75, ts_buoni = ["temp"] }
"undead" = { dv = 12, bab = 0.5, ts_buoni = ["vol"] }
"vermin" = { dv = 8, bab = 0.75, ts_buoni = ["temp"] }

# I tratti del tipo che cambiano il blocco (lotto 5 delle regole complete,
# 2026-11-10). SRD 3.5, basic-rules-and-legal/types-subtypes-and-special-abilities.md:
# Construct e Undead «No Constitution score»; Ooze e Vermin «Mindless: No
# Intelligence score»; Construct «most constructs are mindless» (il caso tipico,
# che il generatore produce). «Mindless creatures do not gain feats or skills».
# Il PRD PF1e dice le stesse cose per gli stessi tipi.
[tratti_tipo]
"construct" = { senza_cos = true, senza_int = true }
"undead" = { senza_cos = true }
"ooze" = { senza_int = true }
"vermin" = { senza_int = true }

# SRD 3.5, Construct Traits: «bonus hit points based on size» (la tabella
