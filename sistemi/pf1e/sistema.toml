# sistemi/pf1e/sistema.toml — Pathfinder 1ª edizione (ADR-0111)
#
# Due ruoli: sistema base del Drappo e del Giardino a Qasr al-Milah, e
# sistema di rinforzo dei moduli 3.5 (template, bersagli per GS). I numeri
# in dati/ li scrive estrai_prd_pf1e.py dal PRD in cache, con la fonte.

id = "pf1e"
nome = "Pathfinder 1ª edizione (PRD)"
tipo = "sistema"
famiglia = "d20"
licenza = "OGL 1.0a"
fonti = ["PRD PF1e in cache (riscontro_srd.py, chiave pf1)"]
skill = ["pathfinder-1e-srd"]

[capacita]
"termini.vietati" = { eredita = "d20", motivo = "le meccaniche 5e sono vietate in tutta la famiglia" }
"statblocco.campi" = { eredita = "d20", motivo = "GS, CA, pf e TS sono gli stessi campi in 3.5 e PF1e" }
"lessico.abilita" = { codice = ["scripts/domande_developer.py:ABILITA_ESTRANEE"], lotto = "L3" }
"lessico.entita" = { dati = ["scripts/lessico_it_pf1.tsv"], nota = "righe di tipo classe, classe di prestigio e razza, lette con lessico_regole.tabella_pf1" }
"lessico.italiano" = { dati = ["scripts/lessico_it_pf1.tsv"] }
"fonti.regole" = { codice = ["scripts/riscontro_srd.py:FONTI"], lotto = "L3" }
"pe.soglie" = { dati = ["sistemi/pf1e/dati/pe.toml"], nota = "tre tracce; la scelta è opzioni.pf1e.traccia_pe" }
"tesoro.per_livello" = { dati = ["sistemi/pf1e/dati/tesoro.toml"], nota = "mo per incontro per APL a tre velocità; la scelta è opzioni.pf1e.velocita_tesoro" }
"incontri.livello" = { dati = ["sistemi/pf1e/dati/incontri.toml"], nota = "GS dell'incontro = il GS più alto il cui valore in PE non supera la somma dei PE" }
"creature.costruzione" = { dati = ["sistemi/pf1e/dati/creature.toml"], nota = "tipi (DV, BAB, TS buoni, gradi) e taglie (CA/attacco, BMC/DMC); calcolo in dmcore/creature_pf1e.py" }
"creature.statistiche_per_gs" = { dati = ["scripts/pf1e-statistiche-per-gs.yaml"] }
"creature.incantesimi" = { codice = ["scripts/dmcore/incantesimi.py:LISTE"], lotto = "L5" }
"creature.regole_di_tipo" = { codice = ["scripts/dmcore/lettura_creatura.py:NON_MORTO_PF1E"], lotto = "L5" }
