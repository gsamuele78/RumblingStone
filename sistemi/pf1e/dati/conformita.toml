# sistemi/pf1e/dati/conformita.toml — i conti che conformita_statblocchi sa
# fare su una scheda PF1e (F4 di ADR-0112, completati con ADR-0119). Un conto
# che manca qui non si fa, e il rapporto lo dice: non si usa la regola 3.5 al
# suo posto. Le tabelle lunghe (classi, sensi) stanno in conformita_prd.toml,
# generato dal PRD da estrai_prd_pf1e.py; qui solo le scelte e gli alias.

fonte = "PRD PF1e (pathfinder-1e-srd): Bestiary «Monster Creation» e «Creature Types», Core «Getting Started», «Combat» e «Combat Maneuvers», tabelle delle classi"

[punti_ferita]
# Media dei dadi vita come in 3.5 (Bestiary, «Hit Dice»: totale in giù).
media = "giu"
# Un PNG con livelli di classe ha il primo dado al massimo e i dadi dopo il
# primo a mezza in su. Scelta del DM, card F4 2 del 2026-11-08 (la versione
# più forte; Sfregio e lo Sgherro la usavano già, l'Asservito armato è
# passato da 34 a 35 pf).
primo_dado_di_classe = "massimo"
mezzi_dopo_il_primo = "su"

[conti]
# Bloccanti nel cancello dei moduli. Uguali in PF1e: CA come somma,
# Iniziativa Migliorata +4, CD 10 + ½ DV + mod.
fatti = ["pf", "CA", "prosa", "iniziativa", "attacco", "CD", "ereditate"]
# ADR-0119: i conti nuovi entrano qui, il cancello li stampa come avviso
# (⚠) e non blocca; passano in `fatti` con la promozione (testing → stable).
in_prova = ["BMC", "DMC", "BAB", "TS", "contatto_sprovvista", "iniziativa_recinto",
            "schivare", "scurovisione", "visione_crepuscolare", "corrompere_acqua", "incanalare",
            "pf_bonus", "pf_misti", "cd_incantesimi"]

[conti.mancanti]
# Nessuno: la card F4 3 del 2026-11-08 («lo dice e salta il conto») è chiusa
# da ADR-0119, le tre regole che mancavano ora vengono dal PRD.

[conti.non_applicabili]
# Conti 3.5 che in PF1e non esistono: il rapporto non li dà per saltati.
lotta = "PF1e non ha la lotta: la sostituiscono BMC e DMC (Core, «Combat Maneuvers»), che si contano"

[bmc]
# Core, «Combat Maneuver Bonus» (book-cr 3437) e «Combat Maneuver Defense» (3439).
# BMC = BAB + For + taglia; Minuscola o più piccola: Des al posto della For.
# Manovre Agili: Des al posto della For nel BMC (talento, Core).
# DMC = 10 + BAB + For + Des + taglia + i bonus alla CA di questi tipi:
bonus_ca_in_dmc = ["circostanza", "deviazione", "schivare", "intuizione", "cognizione",
                   "fortuna", "morale", "profano", "sacro"]
des_al_posto_della_for = ["Manovre Agili"]
piu_piccole_con_des = ["minuscola", "minuta", "piccolissima"]

[ca]
# Le voci della CA che il contatto toglie e quelle che il colto alla sprovvista
# toglie (Core, «Armor Class»): contatto = CA − armatura − scudo − naturale;
# sprovvista = CA − Des positiva − schivare.
armatura = ["armatura", "corazza", "giaco", "camicia", "cuoio", "maglia", "piastre",
            "bande", "imbottita", "pelle", "mithral", "veste magica"]
scudo = ["scudo"]
naturale = ["naturale"]
deviazione = ["deviazione", "anello"]
schivare = ["schivare"]
# Schivare (Dodge, Core): +1 di schivare alla CA, sempre.
talento_schivare = "Schivare"

[ts]
# Tiri salvezza = base delle classi e dei DV razziali + caratteristica + talenti
# + bonus di resistenza scritti nell'equipaggiamento (Core, «Saving Throws»).
talenti = { "Tempra Possente" = "temp", "Riflessi Fulminei" = "rifl", "Volontà di Ferro" = "vol" }
resistenza = "mantello della resistenza"

[pf_bonus]
# Il bonus di pf-dado = DV × mod Cos (Car per un non morto; i costrutti hanno il
# bonus per taglia, non si controlla) + Robustezza (Core, «Toughness»: +3, o
# +1 per DV oltre i 3) + fino a 1 per livello di classe preferita (Core,
# «Favored Class», a scelta del giocatore o del GM).
talento_robustezza = "Robustezza"
robustezza_minimo = 3

[incantesimi]
# CD = 10 + livello dell'incantesimo + mod della caratteristica da incantatore
# (Core, «Magic», «Saving Throw»); LI = livello nella classe. La caratteristica
# per classe è quella delle descrizioni delle classi (Core, APG, ACG, UM).
[incantesimi.caratteristica]
"cleric" = "Sag"
"druid" = "Sag"
"ranger" = "Sag"
"inquisitor" = "Sag"
"warpriest" = "Sag"
"hunter" = "Sag"
"shaman" = "Sag"
"adept" = "Sag"
"paladin" = "Car"
"antipaladin" = "Car"
"bard" = "Car"
"sorcerer" = "Car"
"oracle" = "Car"
"summoner" = "Car"
"bloodrager" = "Car"
"skald" = "Car"
"wizard" = "Int"
"witch" = "Int"
"magus" = "Int"
"alchemist" = "Int"
"arcanist" = "Int"
"investigator" = "Int"

[incanalare]
# Core, Cleric «Channel Energy»: (livello + 1) / 2 d6, CD 10 + ½ livello di
# chierico + Car, 3 + Car volte al giorno.
classi = ["cleric"]

