# sistemi/pf1e/dati/creature.toml — tipi e taglie PF1e (generato da estrai_prd_pf1e.py)
fonte = "PRD PF1e, devonjones/PSRD-Data@76ea4784, book-b1.db sezione 116 «Table: Creature Statistics by Type»"
