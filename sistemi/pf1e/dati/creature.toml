# taglia = { ca_attacco, bmc_dmc }
[taglie]
"fine" = { ca_attacco = 8, bmc_dmc = -8 }
"diminutive" = { ca_attacco = 4, bmc_dmc = -4 }
"tiny" = { ca_attacco = 2, bmc_dmc = -2 }
