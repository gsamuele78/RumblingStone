"construct" = { dv = 10, bab = 1.0, ts_buoni = [], ts_a_scelta = 0, gradi = 2 }
"dragon" = { dv = 12, bab = 1.0, ts_buoni = ["temp", "rifl", "vol"], ts_a_scelta = 0, gradi = 6 }
"fey" = { dv = 6, bab = 0.5, ts_buoni = ["rifl", "vol"], ts_a_scelta = 0, gradi = 6 }
"humanoid" = { dv = 8, bab = 0.75, ts_buoni = [], ts_a_scelta = 1, gradi = 2 }
"magical beast" = { dv = 10, bab = 1.0, ts_buoni = ["temp", "rifl"], ts_a_scelta = 0, gradi = 2 }
"monstrous humanoid" = { dv = 10, bab = 1.0, ts_buoni = ["rifl", "vol"], ts_a_scelta = 0, gradi = 4 }
