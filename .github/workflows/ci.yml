name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills & scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # serve al gate di tracciatura (diff vs base ref)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Python scripts compile
        run: python -m compileall -q scripts converters

      - name: Tool manifest conformance gate (ADR-0012)
        run: python scripts/tools_manifest.py --check

      - name: Shell scripts lint (shellcheck) — non-blocking
        continue-on-error: true
        run: shellcheck -S warning scripts/*.sh || true

      - name: Validate skill trees (frontmatter, links, data YAML)
        run: python scripts/validate_skills.py

      - name: Plans discipline gate — CHANGELOG obbligatorio + promemoria ADR (ADR-0009)
        if: github.event_name == 'pull_request'
        run: python scripts/check_plans_discipline.py --base "origin/${{ github.base_ref }}"

      - name: Validate generated maps (well-formed, in-sync SVGs)
        run: python scripts/validate_maps.py

      - name: Validate Bestiario library (naming, headers, CR, catalog sync)
        run: python scripts/validate_bestiario.py

      - name: Bestiario rules check (GS benchmark, flag policy) — non-blocking
        continue-on-error: true
        run: python scripts/validate_bestiario.py --rules

      - name: Statblocchi machine-readable — blocchi validi e GS coerente (ADR-0021)
        run: python scripts/extract_statblocks.py --check

      - name: Validate DEF module masters (module-standard checklist, token-free review)
        run: python scripts/validate_modules.py

      - name: Moduli standalone (STANDALONE-* e 10-stand-alone/*)
        run: python scripts/validate_standalone.py

      # Non bloccante alla prima passata: la convenzione nasce oggi e il
      # contenuto esistente la rispetta a meta'. Diventa bloccante (--strict)
      # il giorno in cui il rumore e' a zero — non prima, o il gate viene
      # disattivato e allora non trova piu' nemmeno i refusi veri.
      - name: Lingua italiana — refusi meccanici (non bloccante)
        continue-on-error: true
        run: python scripts/validate_lingua.py

      # Idem: misura la norma di italiano-nativo.md (calchi, tic a densita',
      # nomi inglesi dove il glossario vuole l'italiano). ADR-0025.
      - name: Prosa — traduttese e tic dell'IA (non bloccante)
        continue-on-error: true
        run: python scripts/validate_prosa.py

      - name: DM tool smoke tests
        run: |
          python scripts/suggest_encounter.py --help > /dev/null
          python scripts/suggest_loot.py --help > /dev/null
          python scripts/suggest_map.py --help > /dev/null
          python scripts/session_recap.py --help > /dev/null
          python scripts/state_sync.py --help > /dev/null
          python scripts/build_monster_catalog.py --help > /dev/null
          python scripts/validate_bestiario.py --help > /dev/null
          python scripts/render_map_svg.py --help > /dev/null
          python scripts/compile_map_json.py --help > /dev/null
          python scripts/export_uvtt.py --help > /dev/null
          python scripts/import_ultraclear.py --help > /dev/null
          python scripts/update_xp.py --check > /dev/null
          python scripts/hype_homebrew.py --help > /dev/null
          python scripts/dm_dossier.py --help > /dev/null
          python scripts/validate_modules.py --help > /dev/null
          python scripts/tools_manifest.py --help > /dev/null
          # Catena editoriale e da stampa: questi sette dichiaravano `ci_smoke`
          # nel manifest e non venivano eseguiti da nessuno — il contratto
          # prometteva una verifica che non esisteva (ADR-0012).
          python scripts/build_booklet_html.py --help > /dev/null
          python scripts/export_booklet_pdf.py --help > /dev/null
          python scripts/export_booklet_typst.py --help > /dev/null
          python scripts/build_chapter_marks.py --help > /dev/null
          python scripts/extract_scene_prompts.py --help > /dev/null
          python scripts/import_watabou.py --help > /dev/null
          python scripts/campaign_branch.py --help > /dev/null
          python scripts/build_image_derivatives.py --help > /dev/null
          python scripts/validate_booklets.py --help > /dev/null
          python scripts/extract_statblocks.py --help > /dev/null

      - name: Manifest dei booklet (schema, file, immagini, parità fra le catene)
        run: python scripts/validate_booklets.py --spiega

      - name: Install typst (versione FISSATA, mai «latest»)
        # Un compilatore che si aggiorna da solo è una CI che diventa rossa di
        # notte per una riga che nessuno ha scritto. La versione si alza a mano,
        # in un commit che si vede. ADR-0020 §3.
        env:
          TYPST_VERSION: "0.15.1"
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" -o /tmp/typst.tar.xz
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo install /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: Edizione da stampa — i volumi compilano DAVVERO (ADR-0020)
        # Il gate che mancava: senza typst in CI, due booklet della campagna non
        # avevano mai compilato e nessuno poteva accorgersene. Ora ogni manifest
        # del repo produce un PDF vero, con i segnalibri.
        run: python scripts/validate_booklets.py --stampa

      - name: Schede pregenerate — un PDF per giocatore
        run: |
          python scripts/export_booklet_typst.py \
            STANDALONE-Il-Drappo-di-Tarsilia/homebrew/DRAPPO-SCHEDE-PG.manifest.json \
            --per-scheda
          test "$(ls STANDALONE-Il-Drappo-di-Tarsilia/homebrew/schede/*.pdf | wc -l)" -eq 6

      - name: Map JSON contract + UVTT export round-trip (M1/M2)
        run: |
          python scripts/compile_map_json.py scripts/examples/esempio-accampamento-mano-rossa.json --validate-only
          python scripts/compile_map_json.py scripts/examples/esempio-accampamento-mano-rossa.json -o /tmp/ci-map.md
          python scripts/render_map_svg.py /tmp/ci-map.md > /dev/null
          python scripts/export_uvtt.py /tmp/ci-map.md -o /tmp/ci-vtt
          python -c "import json,glob; d=json.load(open(glob.glob('/tmp/ci-vtt/*.uvtt')[0])); assert d['line_of_sight'] and d['portals'] and d['lights'], 'UVTT vuoto'; print('UVTT OK:', len(d['line_of_sight']),'muri')"
          # overlay professionale (bussola/movimenti/callout/zone) dal JSON
          python scripts/compile_map_json.py scripts/examples/campo-drow-1.json -o /tmp/ci-drow.md
          python -c "t=open('/tmp/ci-drow.md',encoding='utf-8').read(); assert '@north' in t and '@path' in t and '@mark' in t and '@zone' in t, 'direttive @ mancanti'; print('direttive @ OK')"
          # import ultra-clear → bozza JSON compilabile (fixture pulita, exit 0)
          python scripts/import_ultraclear.py scripts/tests/fixtures/ultraclear/uniform.md -o /tmp/ci-uc.draft.json --json-report /tmp/ci-uc.conflicts.json -q
          python scripts/compile_map_json.py /tmp/ci-uc.draft.json --validate-only
          python -c "import json; r=json.load(open('/tmp/ci-uc.conflicts.json')); assert r['report_version'] and 'conflicts' in r, 'report malformato'; print('import_ultraclear OK')"

      - name: Unit tests — dmcore / state_apply / next_session (ADR-0007)
        run: python -m unittest discover -s scripts/tests -v

      - name: dm.py unified CLI smoke test (K-C3)
        run: |
          python scripts/dm.py --help > /dev/null
          python scripts/dm.py doctor --ci

      # Il server MCP (ADR-0030) e' una superficie d'esecuzione: il gate verifica
      # che ogni tool del catalogo costruisca una riga di comando valida e senza
      # metacaratteri di shell, e poi lo fa parlare davvero sul suo trasporto.
      # Un server che passa i test interni ma non risponde a `tools/list` non
      # serve a niente.
      - name: Server MCP — catalogo, difese e protocollo
        run: |
          python scripts/mcp_server.py --self-check
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"state_apply","arguments":{}}}' \
            | python scripts/mcp_server.py > /tmp/mcp-out.jsonl
          python - <<'EOF'
          import json
          r = [json.loads(x) for x in open("/tmp/mcp-out.jsonl")]
          assert r[0]["result"]["protocolVersion"], "initialize senza versione"
          n = len(r[1]["result"]["tools"])
          assert n >= 40, f"tools/list ne espone solo {n}"
          assert all("annotations" in t for t in r[1]["result"]["tools"]), "annotazioni mancanti"
          # in sola lettura, chi scrive canone deve essere RIFIUTATO (S-5)
          assert "error" in r[2], "state_apply è partito in sola lettura"
          print(f"server MCP OK — {n} tool, annotazioni presenti, S-5 attiva")
          EOF

  build:
    name: Build skill packages
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build all per-agent skill packages
        run: ./scripts/build-skills.sh --no-deploy

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-packages
          path: build/
          retention-days: 14
