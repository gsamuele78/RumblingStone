    Ha indossato la Corona di Adamantio — «peso e restrizione movimenti testa». Il modulo scrive il
    ricalcolo per esteso: DES 10 → 8, CA 22 → 21.
  quando: Sala della Corona → ARC-07 P1
  cita: '**-2 Destrezza** (peso e restrizione movimenti testa)'
  fonte: 07_il Portale Della Forgia Eterna/PortaleForgia-P1-REVISED-Corretta.md
  reversibile: false
- caratteristica: CAR
