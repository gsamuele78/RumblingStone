artefatti:
- Corona di Adamantio (Topazio + Smeraldo accesi, Rituale Legacy 3 completato)
- Aegis Fang (+2 Returning Dwarven Waraxe, legata, pre-risveglio pieno)

vincoli:
- vincolo: >-
    La Corona NON è rimovibile finché mancano gemme (salvo *Rimuovere Maledizione* CD 25). Vincolo
    ATTIVO con tutte le conseguenze — decisione DM 2026-08-10.
  conseguenze: >-
    Mente Vuota è sempre addosso: nessuna divinazione amica su di lui, nessun contatto telepatico dal
    party. È sempre riconoscibile come il portatore: niente travestimenti né infiltrazioni, e ogni PNG
    che sa cos'è la Corona lo identifica a vista. Da giocare in ARC-08 e ARC-09 (Rethmar, Torre Invisibile).
  fonte: 07_il Portale Della Forgia Eterna/PortaleForgia-P1-REVISED-Corretta.md
- vincolo: >-
    Immunità alla paura (magica e naturale) e scurovisione 36 m, dalla Corona indossata.
  conseguenze: Nessun TS contro la paura va tirato per lui.
  fonte: 07_il Portale Della Forgia Eterna/PortaleForgia-P1-REVISED-Corretta.md

note: >-
  ⚠️ **Il −2 COS non c'è ancora.** È il prezzo del Dono «Il Sangue della Stirpe» al rito di Hella
  (`ARC07-DEF-3` §5), scena non ancora giocata — per questo non è fra i modificatori qui sopra.
  Quando si giocherà si sommerà al +2 COS del rito dello Smeraldo: netto zero sulla COS, cioè due
  pegni permanenti per tornare dov'era. Vedi «Il bilancio di Thorik» sulla scheda DM della Corona.
