# Scheda di Thorik — RICOSTRUITA DAL REPO, non copiata dalla scheda del giocatore.
#
# Perché esiste (lotto G14, 2026-08-10). Thorik era l'unico dei quattro PG senza
# un posto suo nel repo — Tordek, Artemis e Hella hanno una cartella sotto
# `PG/Artefatti/Artefatti-Pg/`, lui no. È esattamente il motivo per cui il
# **−2 DES che la Corona gli impone dal momento in cui la indossa** è potuto
# sparire da tre generazioni di schede senza che nessuno se ne accorgesse: non
# esisteva un posto dove sarebbe dovuto stare, quindi la sua assenza non era
# osservabile. Il DM se n'è accorto a memoria, non leggendo un file.
#
# ⚠️ Le caselle con `attestato_da: null` sono [INFERRED]: il repo non le attesta
# e NON sono state inventate. Quando il DM ritrova la scheda vera si correggono
# solo quelle — tutto il resto è citato riga per riga.
schema_version: 1
pg: Thorik
nome_completo: Thorik Grrskulldark
classe: Dwarf Fighter 13
razza: Nano dello Scudo (Shield Dwarf)
allineamento: Caotico Neutrale (l'artefatto lo spinge verso Legale Buono)
stato: >-
  Vivo. Morto una volta al Guado di Drellin (Arco 00) e riportato indietro, legato ad Aegis Fang.
  Oggi nella Sala della Forgia Eterna, dopo il riposo.

