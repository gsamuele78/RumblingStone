  causa: Bonus immediato della Corona indossata (CAR 8 → 12).
  quando: Sala della Corona → ARC-07 P1
  cita: '**+4 Carisma** (potenziamento)'
  fonte: 07_il Portale Della Forgia Eterna/PortaleForgia-P1-REVISED-Corretta.md
  reversibile: false
- caratteristica: DES
  delta: -2
  causa: >-
    Ha accettato il **Peso del Mondo** nel corpo al rito dello Smeraldo (Opzione B): le articolazioni
    fondono con la pietra. È il portatore a pagare il pegno.
  quando: '2026-07-31 — ARC-07 P4, rito dello Smeraldo / Rituale 3 «Incudine del Mondo»'
  cita: 'perde **permanentemente 2 DES**'
  fonte: 07_il Portale Della Forgia Eterna/ARC07-DEF-1-PIANO-TERRA-TERROS.md
