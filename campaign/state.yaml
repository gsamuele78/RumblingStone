# campaign/state.yaml — FATTI DI CANONE, in forma verificabile
#
# Perché questo file esiste (ADR-0017, lotto G2-bis dell'audit 2026-08).
#   In `state.md` la distinzione fra ciò che è stato GIOCATO e ciò che è solo
#   PREPARATO era una convenzione di prosa: si poteva dimenticare, e infatti è
#   stata dimenticata — la §1 Party collocava i PG dopo una battaglia mai
#   giocata (finding C1). Qui non si può dimenticare: `oggi` e `preparato` sono
#   CHIAVI, e uno schema le pretende. Un fatto senza tempo non è esprimibile.
#
# Cosa NON sta qui: la prosa (§5 promesse, §7 fili narrativi, i banner). Quella
#   resta in `state.md`, scritta a mano, perché è narrazione e non dati.
#
# Come si usa:
#   - questo file è il MASTER dei fatti di §0, §1 e §6;
#   - le tabelle corrispondenti in `state.md` sono GENERATE:
#         python3 scripts/render_state.py            # rigenera
#         python3 scripts/render_state.py --check    # gate CI: in sync?
#     non modificarle a mano — la modifica va fatta qui;
#   - `python3 scripts/validate_state.py` verifica schema e regole.
#
# Lo storico non sta qui: vive in `campaign/state-changelog.md` (append-only).

