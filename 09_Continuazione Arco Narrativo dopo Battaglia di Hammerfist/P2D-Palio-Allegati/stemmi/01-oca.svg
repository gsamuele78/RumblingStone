  </g>
  <path d="M20 20 H180 V150 Q180 210 100 232 Q20 210 20 150 Z" fill="none" stroke="#f0eada" stroke-width="6"/>
  <rect x="30" y="182" width="140" height="26" rx="4" fill="#2a1436" opacity="0.82"/>
  <text x="100" y="200" font-family="Georgia,serif" font-size="12" fill="#e3b44c" text-anchor="middle" font-style="italic">Al suono dell'oro, all'armi</text>
