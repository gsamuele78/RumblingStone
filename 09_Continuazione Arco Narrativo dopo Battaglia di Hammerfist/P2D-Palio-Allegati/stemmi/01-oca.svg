  <defs><clipPath id="g1"><path d="M20 20 H180 V150 Q180 210 100 232 Q20 210 20 150 Z"/></clipPath></defs>
  <path d="M20 20 H180 V150 Q180 210 100 232 Q20 210 20 150 Z" fill="#4a2560" stroke="#f0eada" stroke-width="6"/>
  <g clip-path="url(#g1)">
    <path d="M100 20 H180 V150 Q180 210 100 232 Z" fill="#3e1e52"/>
    <!-- FIGURA (sostituibile: incolla qui il <path> dell'icona, eredita fill/stroke dal gruppo) -->
    <g stroke="#2a1436" stroke-width="2.5" stroke-linejoin="round" fill="#f0eada">
      <path d="M96 168 q-26 -6 -30 -34 q-3 -22 16 -30 q-14 -10 -6 -26 q6 -12 18 -8 q-4 -12 8 -16 q10 -2 12 10 q16 2 18 20 q2 16 -12 22 q16 8 12 30 q-4 24 -32 30 q6 12 -4 16 q-8 2 -10 -8z"/>
    </g>
    <!-- /FIGURA -->
