  <path d="M20 20 H180 V150 Q180 210 100 232 Q20 210 20 150 Z" fill="none" stroke="#d7dce2" stroke-width="6"/>
  <rect x="20" y="182" width="160" height="26" rx="4" fill="#3a0f1c" opacity="0.85"/>
  <text x="100" y="200" font-family="Georgia,serif" font-size="10.5" fill="#dfa93b" text-anchor="middle" font-style="italic">Ferisce e sana il corno che porto</text>
