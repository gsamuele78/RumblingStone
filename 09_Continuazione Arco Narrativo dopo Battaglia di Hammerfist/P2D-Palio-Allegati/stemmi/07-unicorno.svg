    <!-- FIGURA (sostituibile: incolla qui il <path> dell'icona, eredita fill/stroke dal gruppo) -->
    <g stroke="#3a0f1c" stroke-width="2.5" stroke-linejoin="round" fill="#f2f4f7">
      <path d="M78 168 q-14 -18 -6 -44 q6 -20 26 -30 q-2 -10 4 -16 q6 6 10 6 q16 4 20 22 q4 20 -8 34 q-10 12 -24 16 q4 12 -6 16 q-10 2 -16 -4z"/>
