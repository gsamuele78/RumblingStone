<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" role="img" aria-label="Stemma Contrada dell'Unicorno — distretto The Gilded Horn">
  <!-- LIVREA CHANNATHGATE · The Gilded Horn (Sune/Milil): cremisi di Sune e argento di Milil, con l'oro dell'arpa -->
  <defs><clipPath id="u7"><path d="M20 20 H180 V150 Q180 210 100 232 Q20 210 20 150 Z"/></clipPath></defs>
  <path d="M20 20 H180 V150 Q180 210 100 232 Q20 210 20 150 Z" fill="#9e1f3d" stroke="#d7dce2" stroke-width="6"/>
  <g clip-path="url(#u7)">
