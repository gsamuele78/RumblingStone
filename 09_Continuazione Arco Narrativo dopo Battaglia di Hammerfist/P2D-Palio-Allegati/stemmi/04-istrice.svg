<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" role="img" aria-label="Stemma Contrada dell'Istrice — distretto The Quill-Wood Refuge">
  <!-- LIVREA CHANNATHGATE · The Quill-Wood Refuge (Ilmater/Chauntea): verde legnoferro e bruno di terra, bordata d'avorio, catene di rosso Ilmater -->
  <defs><clipPath id="i4"><path d="M20 20 H180 V150 Q180 210 100 232 Q20 210 20 150 Z"/></clipPath></defs>
  <path d="M20 20 H180 V150 Q180 210 100 232 Q20 210 20 150 Z" fill="#2e4a34" stroke="#e8dfc6" stroke-width="6"/>
  <g clip-path="url(#i4)">
    <path d="M100 20 H180 V150 Q180 210 100 232 Z" fill="#27402c"/>
    <!-- catene spezzate (rosso di Ilmater) -->
    <g stroke="#c4565a" stroke-width="3" fill="none"><circle cx="44" cy="150" r="6"/><circle cx="55" cy="156" r="6"/><circle cx="156" cy="150" r="6"/><circle cx="145" cy="156" r="6"/></g>
    <!-- aculei d'avorio -->
    <g stroke="#e8dfc6" stroke-width="2.5" stroke-linecap="round">
      <line x1="60" y1="96" x2="50" y2="60"/><line x1="72" y1="88" x2="66" y2="52"/><line x1="86" y1="84" x2="84" y2="46"/>
      <line x1="100" y1="82" x2="100" y2="44"/><line x1="114" y1="84" x2="116" y2="46"/><line x1="128" y1="88" x2="134" y2="52"/><line x1="140" y1="96" x2="150" y2="60"/>
    </g>
    <!-- FIGURA (sostituibile: incolla qui il <path> dell'icona, eredita fill/stroke dal gruppo) -->
    <g fill="#7a5230" stroke="#2a1c10" stroke-width="2.5" stroke-linejoin="round">
      <path d="M56 128 q0 -34 44 -34 q44 0 44 34 q0 22 -22 30 q-22 8 -44 0 q-22 -8 -22 -30z"/>
      <path d="M144 122 q18 -2 24 8 q-12 8 -26 4z"/>
    </g>
    <!-- /FIGURA -->
    <circle cx="158" cy="124" r="3" fill="#e8dfc6"/>
    <!-- corona antica -->
    <path d="M88 88 h24 l-3 -9 -5 4 -4 -6 -4 6 -5 -4z" fill="#e8dfc6" stroke="#8a7a55" stroke-width="1.2"/>
  </g>
  <path d="M20 20 H180 V150 Q180 210 100 232 Q20 210 20 150 Z" fill="none" stroke="#e8dfc6" stroke-width="6"/>
  <rect x="24" y="182" width="152" height="26" rx="4" fill="#1a2a1e" opacity="0.85"/>
  <text x="100" y="200" font-family="Georgia,serif" font-size="11.5" fill="#e8dfc6" text-anchor="middle" font-style="italic">Pungo solo chi mi assale</text>
  <text x="100" y="14" font-family="Georgia,serif" font-size="12" fill="#2e4a34" text-anchor="middle" font-weight="bold">L'ISTRICE · Ilmater</text>
</svg>
